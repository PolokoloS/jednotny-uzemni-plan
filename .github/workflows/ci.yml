name: Build a smoke test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build
        run: python build.py
      - name: Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke test proti živým službám
        run: npx playwright test
